name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portoes:
    name: fmt, clippy, testes, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # gtk4 e libadwaita são da janela de pergunta. ffmpeg e p7zip existem para os testes de
      # corte de vídeo e de volumes rodarem de verdade: sem eles, esses testes retornam cedo e
      # passam sem ter testado nada. tmux e herdr são os hospedeiros da suíte e2e
      # (crates/ld-daemon/tests/e2e), que também roda os testes de hospedeiro de verdade.
      - name: dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev ffmpeg p7zip-full tmux
      # O herdr não tem pacote no apt: vai o binário do release, numa versão fixa e conferida.
      - name: herdr
        env:
          VERSAO: v0.8.2
          SHA256: 976150a14d490c94b243ea2e1a7eb2dfb67f12e36b182db90936f6728e6aecf4
        run: |
          curl -fsSL -o herdr \
            "https://github.com/herdrdev/herdr/releases/download/$VERSAO/herdr-linux-x86_64"
          echo "$SHA256  herdr" | sha256sum -c -
          sudo install -m 0755 herdr /usr/local/bin/herdr
          herdr --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Aqui faltar tmux, herdr ou python3 é falha: pular a suíte e2e seria um verde que não
      # testou nada.
      - run: ./ci.sh
        env:
          LUKADISPATCH_E2E_EXIGE: "1"

  msrv:
    name: MSRV (rust-version do Cargo.toml)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  # A release sai com daemon, CLI e proxy estáticos (musl). Uma dependência nova que puxe
  # OpenSSL ou linke a glibc quebraria isso só na hora de soltar a versão; aqui quebra no PR.
  musl:
    name: build estático (musl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl -p ld-daemon -p ld-cli -p ld-mcp
          for b in lukadispatchd lukadispatch lukadispatch-mcp; do
            file -b "target/x86_64-unknown-linux-musl/release/$b" | grep -q static \
              || { echo "::error::$b não saiu estático"; exit 1; }
          done

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  scripts:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh ci.sh bin/deploy dist/empacota dist/asr/whisper dist/asr/sherpa
