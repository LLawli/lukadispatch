name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portoes:
    name: fmt, clippy, testes, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # gtk4 e libadwaita são da janela de pergunta. ffmpeg e p7zip existem para os testes de
      # corte de vídeo e de volumes rodarem de verdade: sem eles, esses testes retornam cedo e
      # passam sem ter testado nada.
      - name: dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev ffmpeg p7zip-full
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./ci.sh

  msrv:
    name: MSRV (rust-version do Cargo.toml)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  scripts:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh ci.sh bin/deploy dist/empacota
