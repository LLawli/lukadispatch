[package]
name = "ld-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "ld_daemon"
path = "src/lib.rs"

[[bin]]
name = "lukadispatchd"
path = "src/main.rs"

[dependencies]
ld-core.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

teloxide = "0.17"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }

tempfile = "3"

[dev-dependencies]
