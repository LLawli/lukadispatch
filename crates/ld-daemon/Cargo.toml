[package]
name = "ld-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "ld_daemon"
path = "src/lib.rs"

[[bin]]
name = "lukadispatchd"
path = "src/main.rs"

[features]
default = ["telegram"]
# O Telegram é o único frontend de hoje, mas ele não pode ser o único que compila: um adaptador
# novo (WhatsApp, por exemplo) precisa provar que o domínio não depende de teloxide escondido em
# algum canto. O passo "sem telegram" do ci.sh roda o clippy com esta feature desligada.
telegram = ["dep:teloxide"]

[dependencies]
ld-core.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
async-trait.workspace = true

# rustls no lugar do native-tls padrão: o binário da release roda em distros com libssl de
# versões diferentes, e o OpenSSL dinâmico amarraria o tarball à da máquina que compilou.
teloxide = { version = "0.17", optional = true, default-features = false, features = ["rustls", "ctrlc_handler"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal", "fs"] }

tempfile = "3"

[dev-dependencies]
filetime = "0.2"
tokio = { version = "1.53", features = ["test-util"] }
