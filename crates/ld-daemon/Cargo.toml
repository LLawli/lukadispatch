[package]
name = "ld-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "ld_daemon"
path = "src/lib.rs"

[[bin]]
name = "lukadispatchd"
path = "src/main.rs"

[features]
default = ["telegram"]
# O Telegram é o único frontend de hoje, mas ele não pode ser o único que compila: um adaptador
# novo (WhatsApp, por exemplo) precisa provar que o domínio não depende de teloxide escondido em
# algum canto. O passo "sem telegram" do ci.sh roda o clippy com esta feature desligada.
telegram = ["dep:teloxide"]

[dependencies]
ld-core.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
async-trait.workspace = true

# rustls no lugar do native-tls padrão: o binário da release roda em distros com libssl de
# versões diferentes, e o OpenSSL dinâmico amarraria o tarball à da máquina que compilou.
teloxide = { version = "0.17", optional = true, default-features = false, features = ["rustls", "ctrlc_handler"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal", "fs"] }

tempfile = "3"
# O setup edita o config.toml existente sem perder os comentários de quem o escreveu.
toml_edit = "0.23"
# Token do bot digitado sem eco no terminal.
rpassword = "7"
# O setup confere o sha256 de cada download do motor de voz.
sha2 = "0.10"

[dev-dependencies]
filetime = "0.2"
tokio = { version = "1.53", features = ["test-util"] }
# O Bot API de mentira da suíte e2e (tests/e2e). Já estão na árvore por baixo do teloxide.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
